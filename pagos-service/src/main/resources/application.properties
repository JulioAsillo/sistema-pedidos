spring.application.name=pagos-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/pagos_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.pool-name=pagos-pool
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=pagos-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.zv.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topics.stock-reservado=catalogo.stock-reservado
app.kafka.topics.pago-aprobado=pagos.aprobado
app.kafka.topics.pago-rechazado=pagos.rechazado

logging.level.com.zv=DEBUG
logging.level.org.apache.kafka=WARN